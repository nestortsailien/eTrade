name: Build offline Android APKs
on:
  workflow_dispatch:
  push:
    paths:
      - 'eTrade.zip'
      - 'ePPT.zip'
      - 'scripts/prepare_android.py'
      - '.github/workflows/build-apks.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [eTrade, ePPT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare offline Android project
        run: python3 scripts/prepare_android.py ${{ matrix.app }}
      - name: Build APK
        working-directory: buildsrc/${{ matrix.app }}
        run: gradle --no-daemon assembleDebug
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: buildsrc/${{ matrix.app }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

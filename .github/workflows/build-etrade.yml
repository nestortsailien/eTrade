name: Build eTrade APK only
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-etrade.yml'
jobs:
  build-etrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install icon renderer
        run: python3 -m pip install cairosvg
      - name: Prepare eTrade
        run: python3 scripts/prepare_android.py eTrade
      - name: Build eTrade APK
        working-directory: buildsrc/eTrade
        run: gradle --no-daemon assembleDebug
      - name: Upload eTrade APK
        uses: actions/upload-artifact@v4
        with:
          name: eTrade-apk
          path: buildsrc/eTrade/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

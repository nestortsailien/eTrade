<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life Lab</title>
<style>
:root{--bg:#f4f8fb;--card:#ffffff;--ink:#18324a;--teal:#1f8a82;--blue:#164f73}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
main{min-height:100vh;display:grid;place-items:center;padding:28px}
.card{width:min(760px,100%);background:var(--card);border:1px solid #dce8f0;border-radius:24px;padding:42px;box-shadow:0 14px 34px rgba(24,50,74,.10)}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:12px}
h1{font-size:clamp(32px,6vw,54px);line-height:1.08;margin:0 0 18px}
p{font-size:18px;line-height:1.7;margin:0 0 26px}
a.btn{display:inline-block;text-decoration:none;background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;font-weight:700;padding:14px 20px;border-radius:12px}
a.btn:hover{filter:brightness(.97)}
.small{margin-top:18px;font-size:14px;color:#5d7183}
</style>
</head>
<body>
<main>
  <section class="card">
    <div class="eyebrow">Life Lab</div>
    <h1>Life Lab: A Logical Visual Guide to Career Dilemmas</h1>
    <p>Explore the English edition of <strong>Life Lab</strong>, including all 15 topics, explanations, and interactive presentations.</p>
    <a class="btn" href="https://app.notion.com/p/3d765edfe79a81c3b471e07570045029" target="_blank" rel="noopener noreferrer">Open Life Lab in Notion</a>
    <div class="small">The full content is hosted in Notion.</div>
  </section>
</main>
</body>
</html>

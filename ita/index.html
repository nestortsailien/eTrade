<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ita Tsai</title>
<style>html,body{margin:0;background:#F4F2EC;color:#1A1C20;font-family:Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;font-size:14px;letter-spacing:.08em;text-transform:uppercase}</style>
</head>
<body>
<div class="loading">Loading Ita Tsai portfolio…</div>
<script>
(async function(){
  try{
    const files=['runtime/part01.txt','runtime/part02.txt','runtime/part03.txt','runtime/part04.txt'];
    let html='';
    for(const file of files){
      const r=await fetch(file,{cache:'no-store'});
      if(!r.ok) throw new Error(file+' '+r.status);
      html+=await r.text();
    }

    // Use the real uploaded JPG directly from the repository.
    html=html.replace(
      /<img src="https:\/\/placehold\.co\/1200x800\/F4F2EC\/1F3D6B\?text=Ita\+Tsai" alt="Ita Tsai" width="683" height="1024">/,
      '<img src="images/foto.jpg" alt="Ita Tsai" width="683" height="1024">'
    );
    html=html.replace(
      '<div><span>5</span><p>Products taken to market</p></div>',
      '<div><span>7</span><p>Products taken to market</p></div>'
    );

    // Keep the portrait at its true aspect ratio and avoid browser stretching.
    html=html.replace(
      '</style>',
      '.hero__portrait{height:auto!important}.hero__portrait img{display:block;width:100%;height:auto!important;object-fit:contain!important}@media (min-width:900px){.hero__media{display:flex;justify-content:flex-end}.hero__portrait{width:min(100%,390px);height:auto!important}}\n</style>'
    );

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<div class="loading">Unable to load portfolio.</div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
